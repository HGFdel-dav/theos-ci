name: REA Analysis Debs

on:
  push:
    paths:
      - 'tools/DebsBatchLib/**'
      - '.github/workflows/build-rea-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rea:
    runs-on: macos-14
    env:
      REA_GHIDRA_STARTUP_TIMEOUT_MS: '600000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install REA
        run: |
          npm install --global rea-agents
          rea --help >/dev/null 2>&1 && echo "rea OK" || echo "rea missing"

      - name: Install Ghidra
        run: |
          # Homebrew 无 ghidra cask；匿名 API 会被限流，版本写死（2026-09-21 发布）
          curl -sL --fail "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip" \
            -o /tmp/ghidra.zip
          ls -lh /tmp/ghidra.zip
          cd /tmp
          unzip -o ghidra.zip 2>&1 | tail -4
          echo "unzip exit: ${PIPESTATUS[0]}"
          # macOS 的 BSD find 默认不跟随 /tmp 符号链接，直接用 shell glob 定位
          GHIDRA_DIR=$(ls -d /tmp/ghidra_* 2>/dev/null | head -1)
          echo "GHIDRA_DIR=[$GHIDRA_DIR]"
          test -d "$GHIDRA_DIR"
          test -d "$GHIDRA_DIR/support"
          ls "$GHIDRA_DIR/support" | head -10
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Extract Debs binary
        run: |
          cd tools/DebsBatchLib
          rm -rf Payload
          unzip -q ipa/Debs_v8.0.ipa
          test -f Payload/Debs.app/Debs
          file Payload/Debs.app/Debs
          ls -l Payload/Debs.app/Debs

      - name: REA analyze (native overview)
        run: |
          mkdir -p rea-out
          set +e
          rea analyze "$PWD/tools/DebsBatchLib/Payload/Debs.app/Debs" --provider ghidra --json \
            > rea-out/analyze.json 2> rea-out/analyze.err
          echo "exit=$?"
          wc -c rea-out/analyze.json rea-out/analyze.err
          head -c 1000 rea-out/analyze.json
          echo

      - name: REA instructions (assembly)
        run: |
          set +e
          rea instructions "$PWD/tools/DebsBatchLib/Payload/Debs.app/Debs" --provider ghidra --json \
            > rea-out/instructions.json 2>> rea-out/analyze.err
          echo "exit=$?"
          wc -c rea-out/instructions.json

      - name: REA search (upload flow related)
        run: |
          set +e
          BIN="$PWD/tools/DebsBatchLib/Payload/Debs.app/Debs"
          for q in "GitHub" "upload" "managed_github_repos" "blob"; do
            safe=$(echo "$q" | tr -cd 'A-Za-z0-9_')
            rea search "$BIN" "$q" --provider ghidra --json > "rea-out/search_${safe}.json" 2>> rea-out/analyze.err
            echo "search $q exit=$?"
          done
          ls -l rea-out/

      - name: Upload REA evidence
        uses: actions/upload-artifact@v4
        with:
          name: rea-evidence
          path: rea-out/
          if-no-files-found: warn