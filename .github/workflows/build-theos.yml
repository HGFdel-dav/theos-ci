name: PX Payment Candidate Compile
on:
  push:
    branches: ['px-payment-review-*']
    paths: ['debs/ParallelXPayment/**', '.github/workflows/build-theos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            debs/ParallelXPayment
      - name: Setup Theos and iOS 15.5 SDK
        run: |
          set -e
          brew install ldid xz
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          (cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk)
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Compile isolated payment candidate
        working-directory: debs/ParallelXPayment
        run: |
          set -euo pipefail
          mkdir -p ci-output
          /usr/bin/clang -std=c11 -Wall -Wextra -Werror tests/test_state.c -o "$RUNNER_TEMP/pxp-state"
          "$RUNNER_TEMP/pxp-state"
          /usr/bin/clang -std=c11 -Wall -Wextra -Werror tests/test_host_state.c -o "$RUNNER_TEMP/pxp-host-state"
          "$RUNNER_TEMP/pxp-host-state"
          # Compile the live code path to validate ARC/ABI code generation.
          # This run does NOT package, install or publish a payment test DEB.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile')
          s=p.read_text()
          assert '-DPXP_ENABLE_CANDIDATE=0' in s
          p.write_text(s.replace('-DPXP_ENABLE_CANDIDATE=0','-DPXP_ENABLE_CANDIDATE=1'))
          PY
          make all FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} 2>&1 | tee ci-output/build.log
          test -n "$(find .theos -name 'ParallelXPayment.dylib' -print -quit)"
          echo 'Live code path compile only. No DEB was packaged. Not a functional-test result.' > ci-output/BUILD-SCOPE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px-payment-review-${{ matrix.scheme }}
          path: debs/ParallelXPayment/ci-output/
          if-no-files-found: warn
