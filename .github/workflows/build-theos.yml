name: DebsNewsBatch Build

on:
  push:
    paths:
      - 'debs/DebsNewsBatch/**'
      - '.github/workflows/build-theos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: debs/DebsNewsBatch

      - name: Toolchain and exact SDK
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          xcodebuild -version
          brew install ldid xz dpkg
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/sdks"
          (cd "$HOME/sdks" && git sparse-checkout set iPhoneOS15.5.sdk)
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos/sdks"

      - name: Static checks and portable logic tests
        working-directory: debs/DebsNewsBatch
        run: |
          set -euo pipefail
          python3 tests/check.py
          /usr/bin/clang -Wall -Wextra -Werror -I DebsNewsBatch tests/dnb_logic_test.c -o "$RUNNER_TEMP/dnb_logic_test"
          "$RUNNER_TEMP/dnb_logic_test"

      - name: Build release
        working-directory: debs/DebsNewsBatch
        run: |
          set -euo pipefail
          mkdir -p out
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} 2>&1 | tee out/build.log
          cp packages/*.deb out/
          for p in packages/*.deb; do
            dpkg-deb -I "$p"
            dpkg-deb -c "$p"
          done > out/package-list.txt
          DY=$(find .theos -name 'DebsNewsBatch.dylib' | head -1)
          test -n "$DY"
          cp "$DY" "out/DebsNewsBatch-${{ matrix.scheme }}.dylib"
          cp DebsNewsBatch.plist "out/DebsNewsBatch-${{ matrix.scheme }}.plist"
          file "out/DebsNewsBatch-${{ matrix.scheme }}.dylib"
          (cd out && shasum -a 256 *.deb *.dylib) | tee out/SHA256SUMS_deb_dylib.txt
          ls -la out

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debsnewsbatch-${{ matrix.scheme }}
          path: debs/DebsNewsBatch/out/
          if-no-files-found: warn
