name: PX Payment Enabled Test Package
on:
  push:
    branches: ['px-payment-review-*']
    paths: ['debs/ParallelXPayment/**', '.github/workflows/build-theos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            debs/ParallelXPayment
      - name: Setup Theos and iOS 15.5 SDK
        run: |
          set -euo pipefail
          brew install ldid xz
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          (cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk)
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Run source and C state checks
        working-directory: debs/ParallelXPayment
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p 'test_*source.py' -q
          /usr/bin/clang -std=c11 -Wall -Wextra -Werror tests/test_state.c -o "$RUNNER_TEMP/pxp-state"
          "$RUNNER_TEMP/pxp-state"
          /usr/bin/clang -std=c11 -Wall -Wextra -Werror tests/test_host_state.c -o "$RUNNER_TEMP/pxp-host-state"
          "$RUNNER_TEMP/pxp-host-state"
      - name: Build enabled test package
        working-directory: debs/ParallelXPayment
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} 2>&1 | tee "$RUNNER_TEMP/build.log"
          mkdir -p ci-output
          cp packages/*.deb ci-output/
          shasum -a 256 ci-output/*.deb > ci-output/SHA256SUMS
          echo 'ENABLED TEST PACKAGE: install manually only; no device action by CI.' > ci-output/BUILD-SCOPE.txt
          cp "$RUNNER_TEMP/build.log" ci-output/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: px-payment-enabled-${{ matrix.scheme }}
          path: debs/ParallelXPayment/ci-output/
          if-no-files-found: warn
