name: Build DebsNewsBatch

on:
  push:
    paths:
      - 'debs/DebsNewsBatch/**'
      - '.github/workflows/build-theos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          ( cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: 本地逻辑单测（纯 C，与插件共用同一份 DNBLogic.h）
        run: |
          set -e
          /usr/bin/clang -Wall -Wextra -Werror \
            -I debs/DebsNewsBatch/DebsNewsBatch \
            debs/DebsNewsBatch/tests/dnb_logic_test.c -o "$RUNNER_TEMP/dnb_logic_test"
          "$RUNNER_TEMP/dnb_logic_test"
          python3 debs/DebsNewsBatch/tests/check.py

      - name: 构建 ${{ matrix.scheme }}
        run: |
          set -e
          cd debs/DebsNewsBatch
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} 2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.scheme }}.log"

      - name: 收集 deb / dylib / plist
        run: |
          set -e
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          find debs/DebsNewsBatch -maxdepth 2 -name '*.deb' -exec cp {} "$OUT/" \;
          DY=$(find debs/DebsNewsBatch/.theos -name 'DebsNewsBatch.dylib' | head -1)
          test -n "$DY"
          cp "$DY" "$OUT/DebsNewsBatch-${{ matrix.scheme }}.dylib"
          cp debs/DebsNewsBatch/DebsNewsBatch.plist "$OUT/DebsNewsBatch-${{ matrix.scheme }}.plist"
          cp "$RUNNER_TEMP/build-${{ matrix.scheme }}.log" "$OUT/"
          file "$OUT/DebsNewsBatch-${{ matrix.scheme }}.dylib"
          ls -la "$OUT"

      - name: Upload 产物
        uses: actions/upload-artifact@v4
        with:
          name: debsnewsbatch-${{ matrix.scheme }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
