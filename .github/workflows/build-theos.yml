name: Build Theos Projects

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          # iPhoneOS15.5.sdk（theos/sdks 无 15.5，改用 xybp888/iOS-SDKs 稀疏检出）
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          ( cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"

      - name: Test HMS diagnostic log sink
        run: |
          set -e
          test_file=debs/HMSDiagnostic/tests/logsink.c
          if [ -f "$test_file" ]; then
            /usr/bin/clang -Wall -Wextra -Werror "$test_file" -o "$RUNNER_TEMP/hmsdiag-test"
            "$RUNNER_TEMP/hmsdiag-test"
          fi

      - name: Build rootless arm64
        run: |
          set -e
          FAILED=""
          for dir in debs/*/; do
            [ -f "$dir/Makefile" ] || continue
            if grep -q "roothide only" "$dir/Makefile"; then
              echo "==> rootless arm64: $dir（roothide only，跳过）"
              continue
            fi
            echo "==> rootless arm64: $dir"
            ( cd "$dir" && make clean || true )
            if ! ( cd "$dir" && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ); then
              echo "::warning::rootless 构建失败: $dir（不阻塞其他项目，继续）"
              FAILED="$FAILED $dir"
            fi
          done
          echo "FAILED_ROOTLESS=$FAILED" >> "$GITHUB_ENV"

      - name: Build roothide arm64e
        run: |
          set -e
          FAILED=""
          for dir in debs/*/; do
            [ -f "$dir/Makefile" ] || continue
            echo "==> roothide arm64e: $dir"
            ( cd "$dir" && make clean || true )
            if ! ( cd "$dir" && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ); then
              echo "::warning::roothide 构建失败: $dir（不阻塞其他项目，继续）"
              FAILED="$FAILED $dir"
            fi
          done
          echo "FAILED_ROOTHIDE=$FAILED" >> "$GITHUB_ENV"

      - name: Collect debs and dylibs
        run: |
          mkdir -p packages
          find debs -name '*.deb' -exec cp -v {} packages/ \; || true
          # 同时收集 dylib + 同名 plist（供 TrollFools / Patcher 注入使用）
          for dir in debs/*/; do
            [ -f "$dir/Makefile" ] || continue
            find "$dir/.theos" -name '*.dylib' -exec cp -v {} packages/ \; 2>/dev/null || true
          done
          # 把根目录的 plist 也复制过去
          for p in debs/*/*.plist; do
            [ -f "$p" ] || continue
            cp -v "$p" packages/ || true
          done

      - name: Commit packages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add packages/
          git commit -m "自动构建 deb 包" || true
          # 2.0.5: 并行 run 的产物提交可能冲突——以本次构建产物为准（rebase 时 -X theirs 指本次提交）
          git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null || true; git pull --no-rebase -X theirs origin main --no-edit || true; git add -A; git commit -m "自动构建 deb 包(冲突取本次)" || true; }
          git push origin main || { git pull --rebase -X theirs origin main || true; git push origin main; }

      - name: Verify source remains available
        run: |
          set -e
          test -f debs/TIMCleanKit/Makefile
          test -f debs/TIMCleanKit/control
          test -f debs/TIMCleanKit/TIMCleanKit/Tweak.xm

      - name: Report build failures
        run: |
          if [ -n "$FAILED_ROOTLESS$FAILED_ROOTHIDE" ]; then
            echo "::error::构建失败项目: rootless=$FAILED_ROOTLESS ; roothide=$FAILED_ROOTHIDE （其他项目产物已收集提交，失败详情见上方日志）"
            exit 1
          fi
