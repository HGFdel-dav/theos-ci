name: Build DebsBatch IPA

on:
  push:
    paths:
      - 'tools/DebsBatchLib/**'
      - '.github/workflows/build-debsbatch-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          ( cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"

      - name: Build dylib
        run: |
          set -e
          cd tools/DebsBatchLib
          make clean || true
          make FINALPACKAGE=1
          DYLIB=$(find .theos -name '*.dylib' | head -1)
          test -n "$DYLIB" && test -f "$DYLIB"
          echo "built: $DYLIB"
          echo "--- linked libraries (must be system-only) ---"
          otool -L "$DYLIB" | sed -n '2,20p'
          echo "DYLIB_PATH=$PWD/$DYLIB" >> "$GITHUB_ENV"

      - name: Assemble patched IPA
        run: |
          set -e
          cd tools/DebsBatchLib
          rm -rf Payload PayloadB
          unzip -q ipa/Debs_v8.0.ipa
          # B: 原版仅升版本号（TrollStore 覆盖安装对照组）
          cp -r Payload PayloadB
          python3 scripts/bump_version.py PayloadB/Debs.app/Info.plist
          # A: 注入 dylib 的版本
          python3 scripts/bump_version.py Payload/Debs.app/Info.plist
          mkdir -p Payload/Debs.app/Frameworks
          cp "$DYLIB_PATH" Payload/Debs.app/Frameworks/libDebsBatch.dylib
          # 用 LIEF 给主二进制加 LC_LOAD_DYLIB（insert_dylib 原仓库已 404）
          # macOS runner 的 pip 受 PEP668 保护，用 venv 安装
          python3 -m venv /tmp/debs-venv
          /tmp/debs-venv/bin/pip install -q lief
          /tmp/debs-venv/bin/python scripts/patch_macho.py Payload/Debs.app/Debs "@executable_path/Frameworks/libDebsBatch.dylib"
          echo "--- verify load command ---"
          otool -l Payload/Debs.app/Debs | grep -A3 'LC_LOAD_DYLIB' | tail -6
          # 不手动签名：TrollStore 安装时会全权重签，避免伪签名干扰覆盖安装
          zip -qry DebsBatch-0.1.0.ipa Payload/
          zip -qry Debs-v8.0.1-original.ipa PayloadB/
          ls -l *.ipa
          shasum -a 256 DebsBatch-0.1.0.ipa Debs-v8.0.1-original.ipa | tee ipas.sha256
          echo "IPA_PATH=$PWD" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebsBatch-ipas
          path: |
            tools/DebsBatchLib/DebsBatch-0.1.0.ipa
            tools/DebsBatchLib/Debs-v8.0.1-original.ipa
            tools/DebsBatchLib/ipas.sha256
          if-no-files-found: error