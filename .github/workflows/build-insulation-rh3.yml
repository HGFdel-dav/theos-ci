name: Build Insulation rh3
on:
  push:
    branches: [insulation-0.1.38.1-rh3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (dpkg-deb + ldid from roothide Theos)
        run: |
          git clone --depth=1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/theos/bin/ldid" -h 2>&1 | head -1
          "$RUNNER_TEMP/theos/bin/dpkg-deb" --version | head -1
      - name: Build
        run: |
          cd debs/insulation-rh3
          python3 build.py baseline/com.be-huge.insulation_0.1.38.1_iphoneos-arm64e.deb "${{ matrix.scheme }}" "$RUNNER_TEMP/out.deb"
      - name: Verify
        run: |
          cd debs/insulation-rh3
          python3 verify.py "$RUNNER_TEMP/out.deb" "${{ matrix.scheme }}"
          dpkg-deb -f "$RUNNER_TEMP/out.deb"
          dpkg-deb -c "$RUNNER_TEMP/out.deb" | sed 's/  */ /g' | cut -d' ' -f1,6 > listing.txt
          cat listing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: insulation-rh3-${{ matrix.scheme }}
          path: |
            ${{ runner.temp }}/out.deb
            debs/insulation-rh3/listing.txt
