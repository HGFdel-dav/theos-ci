name: DYYY 41.1 Build

on:
  push:
    branches:
      - dyyy-41.1-local-20261127
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: DYYY ${{ matrix.scheme }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Theos and iPhoneOS 15.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz dpkg
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          ( cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"

      - name: Build DYYY
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          cd debs/DYYY
          rm -f ../../packages/DYYY-${SCHEME}.dylib
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$SCHEME" SCHEME="$SCHEME"

      - name: Collect DYYY dylib
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          cd debs/DYYY
          DYLIB="packages/DYYY-${SCHEME}.dylib"
          test -f "$DYLIB"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/$SCHEME"
          cp "$DYLIB" "$GITHUB_WORKSPACE/artifacts/$SCHEME/DYYY.dylib"
          printf '%s\n' 'SHA256 is calculated after artifact download' > "$GITHUB_WORKSPACE/artifacts/$SCHEME/SHA256SUMS"
          cat "$GITHUB_WORKSPACE/artifacts/$SCHEME/SHA256SUMS"

      - name: Upload DYYY artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYYY-41.1-${{ matrix.scheme }}
          if-no-files-found: error
          path: artifacts/${{ matrix.scheme }}/
