name: Build ShanLianRenew (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang perl git curl xz-utils libssl-dev libplist-dev zip unzip libncurses-dev libtinfo6

      - name: Setup Theos
        run: |
          set -e
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/iossdks"
          ( cd "$HOME/iossdks" && git sparse-checkout set iPhoneOS15.5.sdk )
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/iossdks/iPhoneOS15.5.sdk" "$HOME/theos/sdks/"
          # 官方 Linux 工具链
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          # ldid（Ubuntu 无包，从源码编）
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git "$HOME/ldid-src"
          ( cd "$HOME/ldid-src" && make -j"$(nproc)" && sudo cp -f ldid /usr/local/bin/ldid )
          ldid -V || true

      - name: Build roothide arm64
        run: |
          set -e
          cd debs/ShanLianRenew
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64

      - name: Build roothide arm64e
        run: |
          set -e
          cd debs/ShanLianRenew
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e

      - name: Build rootless arm64
        run: |
          set -e
          cd debs/ShanLianRenew
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shanlian-linux-${{ github.run_id }}
          path: |
            debs/ShanLianRenew/packages/*.deb
            debs/ShanLianRenew/.theos/obj/*/ShanLianRenew.dylib
          if-no-files-found: error
