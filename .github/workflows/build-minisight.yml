name: MiniSight Build

on:
  push:
    branches: [minisight-0.4.0-chat-freeze, minisight-0.7.0-unified-20261105, minisight-0.8.0-20261105, minisight-0.8.1-20261106, minisight-0.8.2-20261107, minisight-0.8.3-20261107, minisight-0.8.5-20261108, minisight-0.8.6-20261108, minisight-0.8.7-20261108, minisight-0.8.8-20261108, minisight-0.8.9-20261108, minisight-0.8.10-20261108, minisight-0.8.11-20261108, minisight-0.8.12-20261108, minisight-0.8.13-20261108, minisight-0.8.14-20261108, minisight-0.8.15-20261108, minisight-0.8.16-20261108]
    paths:
      - 'debs/MiniSight/**'
      - '.github/workflows/build-minisight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            debs/MiniSight
      - name: Portable regression checks
        working-directory: debs/MiniSight
        run: |
          set -euo pipefail
          python3 tools/check_host.py
          python3 tools/check_repairs_20261107.py
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/recorder/recorder_test.c -o "$RUNNER_TEMP/ms-recorder"
          "$RUNNER_TEMP/ms-recorder"
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/layout_test.c -lm -o "$RUNNER_TEMP/ms-layout"
          "$RUNNER_TEMP/ms-layout"
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/gravity_test.c -lm -o "$RUNNER_TEMP/ms-gravity"
          "$RUNNER_TEMP/ms-gravity"
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/chat/chat_test.c tools/chat/ChatCore.c -o "$RUNNER_TEMP/ms-chat"
          "$RUNNER_TEMP/ms-chat"
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/physics_fling_20261107.c -lm -o "$RUNNER_TEMP/ms-fling"
          "$RUNNER_TEMP/ms-fling"
          clang -std=c11 -O2 -Wall -Wextra -Werror tests/chat/layout_follow_20261107.c -lm -o "$RUNNER_TEMP/ms-follow"
          "$RUNNER_TEMP/ms-follow"
          python3 tools/chat/run_local_checks.py
          python3 tools/chat/check_chat_layout.py --cc clang
          python3 -B -m unittest discover -s tests/diagnostics -p 'test_*.py' -v
      - name: Toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          set -euo pipefail
          brew install ldid xz dpkg
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/xybp888/iOS-SDKs.git "$HOME/sdks"
          (cd "$HOME/sdks" && git sparse-checkout set iPhoneOS15.5.sdk)
      - name: Build
        working-directory: debs/MiniSight
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          SDK_PATH="$(find "$HOME/sdks" -maxdepth 3 -type d -name 'iPhoneOS15.5.sdk' -print -quit)"
          if [ -z "$SDK_PATH" ]; then echo 'SDK not found:'; ls -la "$HOME/sdks"; exit 1; fi
          mkdir -p "$HOME/theos/sdks"
          cp -R "$SDK_PATH" "$HOME/theos/sdks/"
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          mkdir -p out
          cp packages/*.deb out/
          (cd out && shasum -a 256 *.deb > SHA256SUMS)
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minisight-${{ matrix.scheme }}
          path: debs/MiniSight/out/
          if-no-files-found: warn
